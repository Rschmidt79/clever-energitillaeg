tilfoej_offentlig_ladning:
  fields:
    dato:
      required: false
      selector:
        date:
    kwh:
      required: true
      example: 120
      selector:
        number:
          min: 0.1
          max: 1000
          step: 0.1
          mode: box
          unit_of_measurement: kWh
    pris:
      required: true
      example: 540
      selector:
        number:
          min: 0
          max: 100000
          step: 0.01
          mode: box
          unit_of_measurement: kr.
    note:
      required: false
      example: Tesla Supercharger, tur til København
      selector:
        text:
fjern_offentlig_ladning:
  fields:
    id:
      required: false
      selector:
        text:
